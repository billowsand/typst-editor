<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typst Editor</title>
    <style>
      /* Prevent theme flash before JS runs */
      html { background: #1c1c1e; }
    </style>
    <script>
      // Apply saved theme before first paint
      try {
        const t = localStorage.getItem('typst-editor-theme') || 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.documentElement.style.background = '#f5f5f7';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
