[package]
name = "typst-editor-gpui"
version = "1.0.0"
edition = "2024"
description = "字笺 · Typst — a local-first Typst editor built with GPUI (gpui-kit)."

[[bin]]
name = "typst-editor-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "0.7.3"
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
image = { version = "0.25", default-features = false }
smallvec = "1"
typst = "0.14"
typst-core = { path = "../crates/typst-core" }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

# Typst compile and GPUI paint are both far too slow unoptimized; keep our own
# crate at -O0 for fast rebuilds but optimize every dependency.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "symbols"
