[package]
name = "typst-editor-gpui"
version = "0.1.0"
edition = "2024"
description = "GPUI (gpui-kit) front end prototype for the Typst editor."

[[bin]]
name = "typst-editor-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui-kit = "0.7.3"
lsp-types = { version = "0.97", features = ["proposed"] }
image = { version = "0.25", default-features = false }
smallvec = "1"
typst = "0.14"
typst-core = { path = "../crates/typst-core" }

# Typst compile and GPUI paint are both far too slow unoptimized; keep our own
# crate at -O0 for fast rebuilds but optimize every dependency.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "symbols"
