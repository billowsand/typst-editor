[package]
name = "typst-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "0.14"
typst-kit = { version = "0.14", features = ["embed-fonts"] }
typst-svg = "0.14"
typst-pdf = "0.14"
typst-ide = "0.14"
comemo = "0.4"
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"

[build-dependencies]
tauri-build = { version = "2", features = [] }
